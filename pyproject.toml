[project]
name = "fhirbridge"
version = "0.1.0"
description = "Self-hostable, BYOK narrative-to-FHIR conversion service with a verification-first harness."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
authors = [{ name = "fhirbridge contributors" }]
keywords = ["fhir", "hl7", "healthcare", "interoperability", "llm", "byok"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  # Framework-neutral conversion, de-identification, validation, and delivery planning.
  "fhiratwill==0.2.0",
  # API
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  # FHIR typed models. See docs/adr/0004-r4-typed-models.md for the R4/R4B decision.
  "fhir.resources==8.3.0",
  # Persistence
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg==0.31.0",
  "alembic==1.19.1",
  # Queue / workers. arq 0.28 constrains redis to <6; hold both together.
  "redis[hiredis]==5.3.1",
  "arq==0.28.0",
  # HTTP client for the validator and terminology sidecars
  "httpx==0.28.1",
  # Crypto / secrets
  "cryptography==50.0.0",
  "argon2-cffi==25.1.0",
  # Rule packs / config
  "pyyaml==6.0.3",
  # Observability
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  # BYOK/BYOM LLM gateway. Provider-agnostic client used by POST /v1/NAR2FHIR.
  "litellm==1.97.0",
]

[project.optional-dependencies]
ocr = ["pytesseract==0.3.13"]

[project.urls]
Homepage = "https://github.com/Safwanmahmoud/FHIR-It-Will"
Documentation = "https://github.com/Safwanmahmoud/FHIR-It-Will/tree/main/docs"
Source = "https://github.com/Safwanmahmoud/FHIR-It-Will"
Issues = "https://github.com/Safwanmahmoud/FHIR-It-Will/issues"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.165.10",
  "respx==0.23.1",
  "mypy==2.3.1",
  "ruff==0.16.4",
  "types-pyyaml==6.0.12.20260815",
  # No [redis] extra: it pins redis>=7, which conflicts with arq's redis<6.
  # Integration tests start Redis via the generic DockerContainer API instead.
  "testcontainers[postgres]==4.15.0",
  "pip-audit==2.10.1",
]
# Not in `dev`: nothing in CI runs the notebooks, and JupyterLab pulls in a large
# dependency tree that would slow every contributor's sync for a tool most of them
# will not open.
notebook = [
  "ipykernel==7.3.0",
  "jupyterlab==4.6.3",
]
# Not in `dev` or `notebook`: only the untracked manuscript under `paper/` needs a
# plotting stack, and nothing in CI renders figures. Requires `notebook` to execute it.
paper = [
  "matplotlib==3.11.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhirbridge"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit
  "C4",            # comprehensions
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "ASYNC",         # async correctness
  "T20",           # no print
  "TID",           # tidy imports
]
ignore = [
  "S101",  # assert is fine (tests, and internal invariants)
  "B008",  # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "S608"]
"scripts/**" = ["T201"]
# Printing is how a notebook communicates, and its cells share one namespace, so
# reassigning a name across cells is idiomatic rather than a mistake.
"notebooks/**" = ["T201", "E402", "F811"]
"paper/**" = ["T201", "E402", "F811", "S311"]
"src/fhirbridge/observability/logging.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# `tests` is a package (relative imports are banned, so test helpers are imported
# as `tests.helpers`). Without this it sorts as a third-party dependency.
known-first-party = ["fhirbridge", "tests"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
# fhir.resources / fhir-core ship partial annotations; arq and testcontainers are
# untyped; litellm is an optional import that only arrives with M2.
module = ["fhir.resources.*", "fhir_core.*", "arq.*", "testcontainers.*", "litellm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Settings fields are required *and* aliased because they are populated from the
# environment by pydantic-settings, never by keyword. That is the intended shape.
warn_required_dynamic_aliases = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: requires real Postgres/Redis/validator/terminology (testcontainers)",
  "e2e: the only tests permitted to touch a network",
  "golden: goldset snapshot tests",
  "contract: OpenAPI / CapabilityStatement contract tests",
  "security: \u00a716.6 required security and safety tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning:fhir_core.*"]

[tool.coverage.run]
source = ["src/fhirbridge"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
